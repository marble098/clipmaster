name: Build ClipMaster

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write # required to publish the GitHub Release below

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Generate Gradle Wrapper
        run: gradle wrapper --gradle-version 8.7

      - name: Build & sign Release APK
        run: ./gradlew assembleRelease
        # Signing happens inline via the "release" signingConfig in
        # app/build.gradle.kts, using the keystore committed at
        # keystore/clipmaster-release.jks. Every build — any commit, CI or
        # local — signs with that same key, so app-release.apk here is
        # already signed and update-compatible with prior versions.

      - name: Rename signed APK
        run: |
          cp app/build/outputs/apk/release/app-release.apk \
             app/build/outputs/apk/release/ClipMaster.apk

      - name: Package KernelSU Module
        run: |
          MODULE_DIR="build/kernelsu-module"
          mkdir -p "$MODULE_DIR/system/app/ClipMaster"

          cp app/build/outputs/apk/release/ClipMaster.apk \
             "$MODULE_DIR/system/app/ClipMaster/ClipMaster.apk"
          cp kernelsu/module.prop "$MODULE_DIR/"
          cp kernelsu/customize.sh "$MODULE_DIR/"

          # Keep the module's version in step with the APK's auto-incrementing
          # build number (see ciBuildNumber in app/build.gradle.kts).
          BUILD_NUM="${GITHUB_RUN_NUMBER:-1}"
          sed -i "s/^version=.*/version=v1.0.$BUILD_NUM/" "$MODULE_DIR/module.prop"
          sed -i "s/^versionCode=.*/versionCode=$BUILD_NUM/" "$MODULE_DIR/module.prop"

          mkdir -p "$MODULE_DIR/META-INF/com/google/android"
          cat > "$MODULE_DIR/META-INF/com/google/android/updater-script" <<'EOF'
          #MAGISK
          EOF
          cat > "$MODULE_DIR/META-INF/com/google/android/update-binary" <<'SHELL'
          #!/sbin/sh
          TMPDIR=/dev/tmp
          MOUNTPATH=/dev/magisk_merge
          [ -d $MOUNTPATH ] || mkdir -p $MOUNTPATH
          # KernelSU/Magisk will handle the rest via customize.sh
          ZIPFILE=$3
          unzip -o "$ZIPFILE" customize.sh -d $TMPDIR 2>/dev/null
          if [ -f "$TMPDIR/customize.sh" ]; then
            . "$TMPDIR/customize.sh"
          fi
          SHELL
          chmod +x "$MODULE_DIR/META-INF/com/google/android/update-binary"

          cd "$MODULE_DIR" && zip -r ../../ClipMaster-KernelSU-Module.zip . -x '*.DS_Store'

      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: ClipMaster-APK
          path: app/build/outputs/apk/release/ClipMaster.apk
          if-no-files-found: error

      - name: Upload KernelSU Module
        uses: actions/upload-artifact@v4
        with:
          name: ClipMaster-KernelSU-Module
          path: ClipMaster-KernelSU-Module.zip
          if-no-files-found: error

      # actions/upload-artifact (above) always wraps its contents in an extra
      # zip on download — that's inherent to how GitHub Actions artifact
      # storage works and isn't something this workflow can turn off.
      # GitHub Release assets don't have that problem: each file downloads
      # in its own real format — the APK as a plain .apk, and the KernelSU
      # module as its own .zip (that's its correct native format as a
      # flashable module, not an extra wrapper layer around it).
      - name: Publish native-format release assets
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: ClipMaster v1.0.${{ github.run_number }}
          files: |
            app/build/outputs/apk/release/ClipMaster.apk
            ClipMaster-KernelSU-Module.zip
